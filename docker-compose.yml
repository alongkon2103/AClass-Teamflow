# Local development database. The team uses Supabase for shared dev, but this
# compose file gives a self-contained Postgres 16 + Adminer for offline work.
# Point DATABASE_URL and DIRECT_URL at postgresql://teamflow:teamflow@localhost:5432/teamflow
services:
  db:
    image: postgres:16
    container_name: teamflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
      POSTGRES_DB: teamflow
    ports:
      - "5432:5432"
    volumes:
      - teamflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow -d teamflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: teamflow_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  teamflow_pgdata:
